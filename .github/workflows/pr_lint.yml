name: 🧹 PR Lint

on:
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # Only check files changed in the PR
      - run: >
          uvx pre-commit run --show-diff-on-failure --color=always
          --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
