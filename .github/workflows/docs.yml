name: 📖 Publish Docs

on:
  push:
    paths:
      - docs/**
      - mkdocs.yml
      # The planner static build is published with the docs, at /planner/
      - src/planner/**
    branches: [dev]
  # Refresh the OpenAPI docs on release
  release:
    types: [published]
  # Allow manual trigger (workflow_dispatch)
  workflow_dispatch:

jobs:
  docs:
    uses: hotosm/gh-workflows/.github/workflows/just.yml@4.1.0
    with:
      environment: "test"
      command: "docs publish"
    secrets: inherit
