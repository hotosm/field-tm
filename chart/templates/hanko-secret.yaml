{{- if .Values.auth.bundled.enabled -}}
{{- $hankoDbHost := include "field-tm.hankoDbServiceHost" . -}}
{{- if not .Values.auth.bundled.db.enabled -}}
{{- $hankoDbHost = required "auth.bundled.db.host is required when auth.bundled.db.enabled=false" .Values.auth.bundled.db.host -}}
{{- end -}}
{{- $config := .Values.auth.bundled.config -}}
{{- $secret := .Values.auth.bundled.secret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "field-tm.hankoServiceName" . }}-config
  labels:
    {{- include "field-tm.labels" . | nindent 4 }}
    app.kubernetes.io/component: hanko
type: Opaque
stringData:
  # Rendered from the same fields as contrib/login/hanko-config.tpl.yaml, but
  # templated by Helm instead of envsubst - the config mixes plain settings
  # with secret material (signing key, db password, SMTP/OAuth credentials),
  # so it's stored as a Secret rather than a ConfigMap.
  hanko-config.yaml: |
    server:
      public:
        address: ":8000"
        cors:
          allow_origins:
            - {{ $config.allowedOrigin | quote }}
          allow_credentials: true
      admin:
        address: ":8001"

    database:
      database: {{ .Values.auth.bundled.db.auth.database | quote }}
      user: {{ .Values.auth.bundled.db.auth.username | quote }}
      password: {{ .Values.auth.bundled.db.auth.password | quote }}
      host: {{ $hankoDbHost | quote }}
      port: 5432

    secrets:
      keys:
        - {{ required "auth.bundled.secret.hankoSecret is required when auth.bundled.enabled=true" $secret.hankoSecret | quote }}

    service:
      name: "Field-TM"

    webauthn:
      enabled: true
      relying_party:
        id: {{ $config.cookieDomain | quote }}
        display_name: "Field-TM"
        origins:
          - {{ $config.allowedOrigin | quote }}

    passkey:
      enabled: true
      optional: true
      acquire_on_registration: never
      acquire_on_login: never

    email:
      require_verification: false

    passcode:
      enabled: true
      ttl: 300

    password:
      enabled: true
      min_length: 8
      recovery: true

    email_delivery:
      enabled: {{ ne $config.smtpHost "" }}
      smtp:
        host: {{ $config.smtpHost | quote }}
        port: {{ $config.smtpPort | quote }}
        user: {{ $secret.smtpUser | quote }}
        password: {{ $secret.smtpPassword | quote }}
      from_address: {{ $config.smtpFromAddress | quote }}
      from_name: "Field-TM"

    session:
      lifespan: 24h
      issuer: {{ $config.redirectUrl | quote }}
      audience:
        - {{ $config.allowedOrigin | quote }}
      cookie:
        name: "hanko"
        domain: {{ $config.cookieDomain | quote }}
        http_only: true
        same_site: lax
        secure: false

    third_party:
      redirect_url: {{ $config.redirectUrl | quote }}
      error_redirect_url: {{ $config.redirectUrl | quote }}
      allowed_redirect_urls:
        - {{ printf "%s/**" $config.allowedOrigin | quote }}
      providers:
        google:
          enabled: {{ $config.googleEnabled }}
          client_id: {{ $config.googleClientId | quote }}
          secret: {{ $secret.googleClientSecret | quote }}
          allow_linking: true
{{- end }}
