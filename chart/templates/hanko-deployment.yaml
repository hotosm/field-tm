{{- if .Values.auth.bundled.enabled -}}
{{- $hankoDbHost := include "field-tm.hankoDbServiceHost" . -}}
{{- if not .Values.auth.bundled.db.enabled -}}
{{- $hankoDbHost = required "auth.bundled.db.host is required when auth.bundled.db.enabled=false" .Values.auth.bundled.db.host -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "field-tm.hankoServiceName" . }}
  labels:
    {{- include "field-tm.labels" . | nindent 4 }}
    app.kubernetes.io/component: hanko
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "field-tm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hanko
  template:
    metadata:
      labels:
        {{- include "field-tm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hanko
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.auth.bundled.db.enabled }}
        - name: hanko-db-check
          image: "{{ .Values.auth.bundled.db.image.repository }}:{{ .Values.auth.bundled.db.image.tag }}"
          imagePullPolicy: IfNotPresent
          {{- with .Values.dbCheckSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_HOST
              value: {{ $hankoDbHost | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.auth.bundled.db.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.auth.bundled.db.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.auth.bundled.db.auth.database | quote }}
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                  echo "waiting for hanko database to be ready";
                  sleep 2;
              done;
        {{- end }}
        - name: hanko-migrate
          image: "{{ .Values.auth.bundled.image.repository }}:{{ .Values.auth.bundled.image.tag }}"
          imagePullPolicy: {{ .Values.auth.bundled.image.pullPolicy }}
          {{- with .Values.initSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["migrate", "up", "--config", "/config/hanko-config.yaml"]
          volumeMounts:
            - name: hanko-config
              mountPath: /config
              readOnly: true
      containers:
        - name: hanko
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.auth.bundled.image.repository }}:{{ .Values.auth.bundled.image.tag }}"
          imagePullPolicy: {{ .Values.auth.bundled.image.pullPolicy }}
          args: ["serve", "all", "--config", "/config/hanko-config.yaml"]
          ports:
            - name: public
              containerPort: 8000
              protocol: TCP
            - name: admin
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /hanko
                - isready
                - --config
                - /config/hanko-config.yaml
                - public
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /hanko
                - isready
                - --config
                - /config/hanko-config.yaml
                - public
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.auth.bundled.resources | nindent 12 }}
          volumeMounts:
            - name: hanko-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: hanko-config
          secret:
            secretName: {{ include "field-tm.hankoServiceName" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
