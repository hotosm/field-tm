<div id="app-picker" class="wa-stack wa-gap-s">
  {% if reason %}
  <wa-callout variant="brand" size="s">{{ reason }}</wa-callout>
  {% endif %}
  <div class="wa-grid wa-gap-s ftm-app-grid">
    {% for app in apps %}
    <label class="ftm-choice">
      <input
        type="radio"
        name="field_mapping_app"
        value="{{ app.key.value }}"
        required
        {{ "checked" if app.key.value == selected }}
      />
      {% include "partials/app_logo.html" %}
      <span class="wa-stack wa-gap-2xs">
        <span class="wa-cluster wa-gap-xs">
          <strong>{{ app.name }}</strong>
          {% if app.key in recommended %}
          <wa-badge variant="success">{{ _("Recommended") }}</wa-badge>
          {% endif %}
        </span>
        <small class="ftm-hint">{{ app.description }}</small>
        <small class="ftm-hint">{{ _("Good for:") }} {{ app.good_for }}</small>
        <small class="ftm-hint">
          {% if app.syncs %}{{ _("Tasks sync to the app.") }}{% else %}{{ _("Mappers download task
          files.") }}{% endif %}
        </small>
      </span>
    </label>
    {% endfor %}
  </div>
</div>
