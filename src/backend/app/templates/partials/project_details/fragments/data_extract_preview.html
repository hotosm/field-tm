<div class="wa-stack">
  <wa-callout variant="{{ status_variant }}">{{ status_message }}</wa-callout>
  <div id="geojson-preview-container" class="wa-stack">
    <wa-callout variant="neutral">{{ preview_message }}</wa-callout>
    {% if warning_message %}
    <wa-callout variant="warning">{{ warning_message }}</wa-callout>
    {% endif %}
    <div class="wa-cluster wa-gap-s">
      <wa-button
        id="accept-data-extract-btn"
        variant="brand"
        hx-post="/accept-data-extract-htmx?project_id={{ project_id }}"
        hx-target="#osm-data-status"
        hx-swap="innerHTML"
      >
        {{ _("Accept Data Extract") }}
      </wa-button>
      <wa-button
        id="discard-data-extract-btn"
        variant="neutral"
        appearance="outlined"
        hx-post="/discard-data-extract-htmx?project_id={{ project_id }}"
        hx-target="#osm-data-status"
        hx-swap="innerHTML"
        hx-confirm="{{ _('Discard the downloaded data extract?') }}"
      >
        {{ _("Discard") }}
      </wa-button>
    </div>
  </div>
</div>
