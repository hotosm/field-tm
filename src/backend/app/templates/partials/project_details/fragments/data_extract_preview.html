<div>
  <wa-callout variant="{{ status_variant }}">
    <span>{{ status_message }}</span>
  </wa-callout>
  <div id="geojson-preview-container" style="margin-top: 15px">
    <div style="margin-bottom: 10px">
      <wa-callout variant="info">
        <span>{{ preview_message }}</span>
      </wa-callout>
    </div>
    {{ map_html_content | safe }}
    <div style="margin-top: 15px; display: flex; gap: 10px">
      <button
        id="accept-data-extract-btn"
        type="button"
        hx-post="/accept-data-extract-htmx?project_id={{ project_id }}"
        hx-target="#osm-data-status"
        hx-swap="innerHTML"
        class="wa-button wa-button--primary"
        style="flex: 1"
      >
        {{ _("Accept Data Extract") }}
      </button>
      <button
        id="discard-data-extract-btn"
        type="button"
        hx-post="/discard-data-extract-htmx?project_id={{ project_id }}"
        hx-target="#osm-data-status"
        hx-swap="innerHTML"
        hx-confirm="{{ _('Discard the downloaded data extract?') }}"
        class="wa-button wa-button--default"
      >
        {{ _("Discard") }}
      </button>
    </div>
  </div>
</div>
