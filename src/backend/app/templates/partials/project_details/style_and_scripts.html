<script>
  (function() {
    const projectId = {% if project %}{{ project.id }}{% else %}null{% endif %};
    if (!projectId) return;

    const hasXlsform = {{ 'true' if has_xlsform else 'false' }};
    const i18nStrings = {
      selectSurveyTypePlaceholder: {{ _("Select a survey type...")|tojson }},
      noSurveyTypesAvailable: {{ _("No survey types available")|tojson }},
      noSurveyFormsAvailable: {{ _("No survey forms are available. Upload your own survey file above.")|tojson }},
      selectSurveyTypeOrUpload: {{ _("Pick a survey form, or upload your own.")|tojson }},
      surveyTypeSelected: {{ _("Survey type selected.")|tojson }},
      invalidXlsformFileType: {{ _("Invalid file type. Please upload a .xls or .xlsx file.")|tojson }},
      selectedFilePrefix: {{ _("Selected file:")|tojson }},
      customFormSelected: {{ _("Custom form selected.")|tojson }},
      chooseSurveyTypeFirst: {{ _("Pick a survey form, or upload your own first.")|tojson }},
      polygons: {{ _("polygons")|tojson }},
      polylines: {{ _("polylines")|tojson }},
      points: {{ _("points")|tojson }},
      features: {{ _("features")|tojson }},
      customFormDownloadNote: {{ _("You uploaded a custom form, so this OSM download is optional. Upload your own map file below or open More options to adjust the source.")|tojson }},
      recommendedSourceFormat: {{ _("Recommended for your form: %(title)s (%(geom_label)s). Review the data on the map, then continue.")|tojson }},
      recommendedSourceUpdatedFormat: {{ _("Source updated (%(geom_label)s). Review the data on the map, then continue.")|tojson }},
      downloading: {{ _("Downloading...")|tojson }},
      downloadOsmData: {{ _("Use OSM data")|tojson }},
      invalidGeojsonFileType: {{ _("Invalid file type. Please upload a .geojson or .json file.")|tojson }},
      confirmNoSplitting: {{ _("Confirm No Splitting")|tojson }},
      splitBySquare: {{ _("Split by grid")|tojson }},
      splitByBuildings: {{ _("Split by buildings")|tojson }},
      splitAoi: {{ _("Split area")|tojson }},
      selectOption: {{ _("Select Option")|tojson }},
      confirming: {{ _("Confirming...")|tojson }},
      splitting: {{ _("Splitting...")|tojson }},
      odkCentral: {{ _("ODK Central")|tojson }},
      qfield: {{ _("QField")|tojson }},
      mappingTool: {{ _("the mapping tool")|tojson }},
      projectTypeNotSet: {{ _("Project type not set. Please set the field mapping app first.")|tojson }},
      finaliseConfirmFormat: {{ _("Are you sure you want to finalise this project in %(project_type)s? This will create the project, upload forms, and generate all necessary files.")|tojson }},
      customOdkCredentials: {{ _("Custom ODK Credentials")|tojson }},
      customQFieldCredentials: {{ _("Custom QField Credentials")|tojson }},
      pleaseFillAllFields: {{ _("Please fill in all fields.")|tojson }},
      testing: {{ _("Testing...")|tojson }},
      testingCredentials: {{ _("Testing credentials...")|tojson }},
      credentialsValid: {{ _("✓ Credentials are valid!")|tojson }},
      invalidCredentials: {{ _("Invalid credentials. Please check and try again.")|tojson }},
      errorTestingCredentialsFormat: {{ _("Error testing credentials: %(message)s")|tojson }},
      testCredentials: {{ _("Test Credentials")|tojson }},
      pleaseTestCredentialsFirst: {{ _("Please test credentials first before continuing.")|tojson }},
      creatingProjectFormat: {{ _("Creating project in %(project_type)s... This may take a moment.")|tojson }},
      errorPrefix: {{ _("Error:")|tojson }},
      finalizeCompleteEvent: 'project-setup:finalize-complete',
      step3CompleteEvent: 'project-setup:step3-complete',
      step4CompleteEvent: 'project-setup:step4-complete',
      step4PreviewReadyEvent: 'project-setup:step4-preview-ready',
    };
    import('/static/js/project_setup_shared.js')
      .then((shared) => {
        const {
          bindAdvancedToggle,
        } = shared;

        // Step 2/3 setup behavior is loaded from static module
        const initialFormTemplates = {{ form_templates_json|safe if form_templates_json else '[]' }};
        import('/static/js/project_setup_forms.js')
          .then(({ initProjectSetupForms }) => {
            initProjectSetupForms({
              i18nStrings,
              projectId,
              hasXlsform,
              initialFormTemplates,
            });
          })
          .catch(() => {
            // Keep setup flow usable even if optional form/data script fails to load.
          });

        // Step 4: Split area behavior is loaded from static module
        import('/static/js/project_setup_split.js')
          .then(({ initProjectSetupSplit }) => {
            initProjectSetupSplit({ i18nStrings });
          })
          .catch(() => {
            // Keep setup flow usable even if optional split script fails to load.
          });

        // Step 5: Finalise Project behavior is loaded from static module
        const projectType = {% if field_mapping_app_value %}"{{ field_mapping_app_value|e }}"{% else %}null{% endif %};
        import('/static/js/project_setup_finalize.js')
          .then(({ initProjectSetupFinalize }) => {
            initProjectSetupFinalize({ i18nStrings, projectId, projectType });
          })
          .catch(() => {
            // Keep setup flow usable even if optional finalize script fails to load.
          });
      })
      .catch(() => {
        // Keep setup flow usable even if shared setup script fails to load.
      });

    // NOTE: We intentionally do not auto-load Leaflet previews on page load.
    // This keeps Step 3 "completed" state collapsed (no reserved space for the map).
  })();
</script>
