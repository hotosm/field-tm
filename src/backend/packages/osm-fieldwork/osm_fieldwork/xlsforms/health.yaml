survey:
  - '#': Based on the Healthsites campaign form (https://healthsites.io).
      Edit this YAML, not an Excel copy.
      The osm_key column gives each question's OSM tag for the GeoJSON export.
  - type: geopoint
    name: new_feature
    label::English(en): Facility Location
    required: yes
    label::French(fr): Localisation de la structure sanitaire
    label::Spanish(es): Ubicación del establecimiento de salud
    label::Swahili(sw): Mahali kilipo kituo cha afya
  - type: note
    name: _licence_note
    label::English(en): The information you enter will be published openly on OpenStreetMap
      and healthsites.io under the Open Database License (ODbL 1.0). Do not enter personal
      information about patients or staff.
    label::French(fr): Les informations que vous saisissez seront publiées librement
      sur OpenStreetMap et healthsites.io sous la licence Open Database License (ODbL
      1.0). Ne saisissez aucune donnée personnelle concernant les patients ou le personnel.
    label::Spanish(es): La información que introduzca se publicará abiertamente en OpenStreetMap
      y healthsites.io bajo la licencia Open Database License (ODbL 1.0). No introduzca
      datos personales de pacientes ni de personal.
    label::Swahili(sw): Taarifa utakazoingiza zitachapishwa wazi kwenye OpenStreetMap
      na healthsites.io chini ya leseni ya Open Database License (ODbL 1.0). Usiingize
      taarifa binafsi za wagonjwa au wafanyakazi.
  - type: calculate
    name: source
    calculation: "'survey'"
    guidance_hint::English(en): Used to indicate the source of information (i.e. meta
      data) added to OpenStreetMap
    guidance_hint::French(fr): Utilisé pour indiquer la source de l'information (c.-à-d.
      les métadonnées) ajoutée à OpenStreetMap
    guidance_hint::Spanish(es): Indica la fuente de la información (metadatos) añadida
      a OpenStreetMap
    guidance_hint::Swahili(sw): Hutumika kuonyesha chanzo cha taarifa (metadata) zilizoongezwa
      kwenye OpenStreetMap
    osm_key: source
  - type: text
    name: name
    label::English(en): Name of Facility
    required: yes
    guidance_hint::English(en): The primary tag used for naming an element
    label::French(fr): Nom de la structure sanitaire
    guidance_hint::French(fr): La clé principale utilisée pour nommer un élément
    label::Spanish(es): Nombre del establecimiento de salud
    guidance_hint::Spanish(es): La etiqueta principal para dar nombre a un elemento
    label::Swahili(sw): Jina la kituo cha afya
    guidance_hint::Swahili(sw): Lebo kuu inayotumika kutaja jina la kipengele
    osm_key: name
  - type: begin group
    name: addr
    label::English(en): Address
    appearance: field-list
    label::French(fr): Adresse
    label::Spanish(es): Dirección
    label::Swahili(sw): Anwani
  - type: text
    name: housenumber
    label::English(en): House Number
    guidance_hint::English(en): The house number (may contain non-digits). If a single
      entry has multiple house numbers, separate them by ",". e.g. "12b,12c". Only required
      key for an address (except when key:addr:housename is used), all others are optional.
    label::French(fr): Numéro de la maison
    guidance_hint::French(fr): Le numéro de la maison (peut contenir des caractères
      non numériques). Si une entrée comporte plusieurs numéros, séparez-les par « ,
      », p. ex. « 12b,12c ». Seule clé obligatoire d'une adresse (sauf si la clé addr:housename
      est utilisée) ; toutes les autres sont facultatives.
    label::Spanish(es): Número de casa
    guidance_hint::Spanish(es): El número de la casa (puede contener caracteres no numéricos).
      Si un elemento tiene varios números, sepárelos con ",", por ejemplo "12b,12c".
      Es la única clave obligatoria de una dirección (salvo si se usa addr:housename);
      las demás son opcionales.
    label::Swahili(sw): Namba ya nyumba
    guidance_hint::Swahili(sw): Namba ya nyumba (inaweza kuwa na herufi). Ikiwa kuna
      namba zaidi ya moja, zitenganishe kwa ",", kwa mfano "12b,12c". Hii ndiyo ufunguo
      pekee unaohitajika kwenye anwani (isipokuwa addr:housename ikitumika); nyingine
      zote si lazima.
    osm_key: addr:housenumber
  - type: text
    name: street
    label::English(en): Street
    guidance_hint::English(en): The street name portion of an address
    label::French(fr): Rue
    guidance_hint::French(fr): Le nom de la rue faisant partie de l'adresse
    label::Spanish(es): Calle
    guidance_hint::Spanish(es): El nombre de la calle en una dirección
    label::Swahili(sw): Mtaa
    guidance_hint::Swahili(sw): Jina la mtaa katika anwani
    osm_key: addr:street
  - type: text
    name: postcode
    label::English(en): Post Code
    guidance_hint::English(en): The postal code of the building/area
    label::French(fr): Code postal
    guidance_hint::French(fr): Le code postal du bâtiment ou de la zone
    label::Spanish(es): Código postal
    guidance_hint::Spanish(es): El código postal del edificio o de la zona
    label::Swahili(sw): Msimbo wa posta
    guidance_hint::Swahili(sw): Msimbo wa posta wa jengo au eneo
    osm_key: addr:postcode
  - type: text
    name: city
    label::English(en): City
    guidance_hint::English(en): The name of a city/village (locality), like used as
      a part of a postal address
    label::French(fr): Ville
    guidance_hint::French(fr): Le nom de la ville ou du village (localité), tel qu'utilisé
      dans une adresse postale
    label::Spanish(es): Ciudad
    guidance_hint::Spanish(es): El nombre de la ciudad o del pueblo (localidad), tal
      como se usa en una dirección postal
    label::Swahili(sw): Mji
    guidance_hint::Swahili(sw): Jina la mji au kijiji (eneo), kama linavyotumika kwenye
      anwani ya posta
    osm_key: addr:city
  - type: text
    name: country
    label::English(en): Country
    hint::English(en): Two-letter ISO country code, for example SN.
    constraint: coalesce(., '') = '' or regex(., '^[A-Za-z]{2}$')
    constraint_message::English(en): Enter the two-letter country code.
    guidance_hint::English(en): The country code of the current address
    label::French(fr): Pays
    hint::French(fr): Code pays ISO à deux lettres, par exemple SN.
    constraint_message::French(fr): Entrez le code pays à deux lettres.
    guidance_hint::French(fr): Le code pays de l'adresse
    label::Spanish(es): País
    hint::Spanish(es): Código de país ISO de dos letras, por ejemplo SN.
    constraint_message::Spanish(es): Introduzca el código de país de dos letras.
    guidance_hint::Spanish(es): El código de país de la dirección
    label::Swahili(sw): Nchi
    hint::Swahili(sw): Msimbo wa nchi wa ISO wenye herufi mbili, kwa mfano SN.
    constraint_message::Swahili(sw): Ingiza msimbo wa nchi wenye herufi mbili.
    guidance_hint::Swahili(sw): Msimbo wa nchi wa anwani hii
    osm_key: addr:country
  - type: end group
  - type: text
    name: contact_number
    label::English(en): Phone Number
    hint::English(en): Include the international calling code, for example +221.
    constraint: coalesce(., '') = '' or regex(., '^\+?[1-9]\d{1,14}$')
    constraint_message::English(en): Entry must be in E.164 format. Only +, a valid
      country code and numbers are allowed.
    guidance_hint::English(en): The contact tag is the prefix for several contact:*
      keys to describe contacts
    label::French(fr): Numéro de téléphone
    hint::French(fr): Inclure l'indicatif international, par exemple +221.
    constraint_message::French(fr): Le numéro doit être au format E.164. Seuls le signe
      +, un indicatif de pays valide et des chiffres sont acceptés.
    guidance_hint::French(fr): La clé contact est le préfixe de plusieurs clés contact:*
      qui décrivent les moyens de contact
    label::Spanish(es): Número de teléfono
    hint::Spanish(es): Incluya el prefijo internacional, por ejemplo +221.
    constraint_message::Spanish(es): El número debe tener el formato E.164. Solo se
      admiten el signo +, un prefijo de país válido y dígitos.
    guidance_hint::Spanish(es): La clave contact es el prefijo de varias claves contact:*
      que describen las formas de contacto
    label::Swahili(sw): Namba ya simu
    hint::Swahili(sw): Weka msimbo wa kimataifa wa simu, kwa mfano +221.
    constraint_message::Swahili(sw): Namba lazima iwe katika muundo wa E.164. Inaruhusiwa
      alama ya +, msimbo halali wa nchi na tarakimu pekee.
    guidance_hint::Swahili(sw): Ufunguo contact ni kiambishi cha funguo kadhaa za contact:*
      zinazoelezea njia za mawasiliano
    osm_key: contact:phone
  - type: select_one oper_list
    name: operator_type
    label::English(en): Operator Type
    guidance_hint::English(en): This tag is used to give more information about the
      type of operator for a feature
    label::French(fr): Type d'exploitant
    guidance_hint::French(fr): Cette clé donne plus d'informations sur le type d'exploitant
      d'un élément
    label::Spanish(es): Tipo de operador
    guidance_hint::Spanish(es): Esta etiqueta da más información sobre el tipo de operador
      de un elemento
    label::Swahili(sw): Aina ya mwendeshaji
    guidance_hint::Swahili(sw): Lebo hii inatoa maelezo zaidi kuhusu aina ya mwendeshaji
      wa kipengele
    osm_key: operator:type
  - type: text
    name: operator
    label::English(en): Facility Operator Name
    guidance_hint::English(en): The operator tag is used to name a company, corporation,
      person or any other entity who is directly in charge of the current operation
      of a map object
    label::French(fr): Nom de l'exploitant de l'établissement
    guidance_hint::French(fr): La clé operator sert à nommer l'entreprise, la société,
      la personne ou toute autre entité directement responsable du fonctionnement de
      l'élément cartographié
    label::Spanish(es): Nombre del operador del establecimiento
    guidance_hint::Spanish(es): La etiqueta operator indica la empresa, sociedad, persona
      u otra entidad directamente responsable del funcionamiento actual del elemento
    label::Swahili(sw): Jina la mwendeshaji wa kituo
    guidance_hint::Swahili(sw): Lebo ya operator hutaja kampuni, shirika, mtu au taasisi
      nyingine inayohusika moja kwa moja na uendeshaji wa sasa wa kipengele
    osm_key: operator
  - type: select_one op_stat_list
    name: operational_status
    label::English(en): Operational Status
    guidance_hint::English(en): Used to document an observation of the current functional
      status of a mapped feature
    label::French(fr): Statut opérationnel
    guidance_hint::French(fr): Utilisé pour documenter une observation de l'état de
      fonctionnement actuel d'un élément cartographié
    label::Spanish(es): Estado operativo
    guidance_hint::Spanish(es): Registra una observación del estado de funcionamiento
      actual de un elemento
    label::Swahili(sw): Hali ya utendaji
    guidance_hint::Swahili(sw): Hutumika kurekodi hali ya sasa ya utendaji wa kipengele
      iliyoonekana
    osm_key: operational_status
  - type: select_one oh_list
    name: _opening_hours_type
    label::English(en): When is the facility open?
    hint::English(en): Select an option for how you would like to enter the open hours.
    required: yes
    label::French(fr): Quand la structure sanitaire est-elle ouverte ?
    hint::French(fr): Sélectionnez une option pour indiquer comment vous souhaitez entrer
      les heures d'ouverture.
    label::Spanish(es): ¿Cuándo está abierto el establecimiento?
    hint::Spanish(es): Seleccione cómo desea introducir el horario de apertura.
    label::Swahili(sw): Kituo kinafunguliwa lini?
    hint::Swahili(sw): Chagua jinsi unavyotaka kuingiza saa za kufungua.
  - type: begin group
    name: _dow_group
    label::English(en): Open hours by day of the week
    appearance: field-list
    relevant: ${_opening_hours_type} = 'oh_select'
    label::French(fr): Heures d'ouverture par jour de la semaine
    label::Spanish(es): Horario de apertura por día de la semana
    label::Swahili(sw): Saa za kufungua kwa kila siku ya wiki
  - type: note
    name: _hours_note
    label::English(en): Enter open hours for each day. Leave a day empty if the facility
      is closed.
    hint::English(en): 'Format like: 09:00-18:30, 08:00-11:00,12:30-15:00 or sunrise-sunset'
    label::French(fr): Entrez les heures d'ouverture pour chaque jour. Laissez vide
      si la structure est fermée ce jour-là.
    hint::French(fr): 'Format : 09:00-18:30, 08:00-11:00,12:30-15:00 ou sunrise-sunset'
    label::Spanish(es): Introduzca el horario de cada día. Deje el día vacío si el establecimiento
      está cerrado.
    hint::Spanish(es): 'Formato: 09:00-18:30, 08:00-11:00,12:30-15:00 o sunrise-sunset'
    label::Swahili(sw): Ingiza saa za kufungua za kila siku. Acha wazi kama kituo kimefungwa
      siku hiyo.
    hint::Swahili(sw): 'Muundo: 09:00-18:30, 08:00-11:00,12:30-15:00 au sunrise-sunset'
  - type: text
    name: _mon_hours
    label::English(en): Monday open hours
    label::French(fr): Heures d'ouverture du lundi
    label::Spanish(es): Horario del lunes
    label::Swahili(sw): Saa za kufungua Jumatatu
  - type: text
    name: _tue_hours
    label::English(en): Tuesday open hours
    label::French(fr): Heures d'ouverture du mardi
    label::Spanish(es): Horario del martes
    label::Swahili(sw): Saa za kufungua Jumanne
  - type: text
    name: _wed_hours
    label::English(en): Wednesday open hours
    label::French(fr): Heures d'ouverture du mercredi
    label::Spanish(es): Horario del miércoles
    label::Swahili(sw): Saa za kufungua Jumatano
  - type: text
    name: _thu_hours
    label::English(en): Thursday open hours
    label::French(fr): Heures d'ouverture du jeudi
    label::Spanish(es): Horario del jueves
    label::Swahili(sw): Saa za kufungua Alhamisi
  - type: text
    name: _fri_hours
    label::English(en): Friday open hours
    label::French(fr): Heures d'ouverture du vendredi
    label::Spanish(es): Horario del viernes
    label::Swahili(sw): Saa za kufungua Ijumaa
  - type: text
    name: _sat_hours
    label::English(en): Saturday open hours
    label::French(fr): Heures d'ouverture du samedi
    label::Spanish(es): Horario del sábado
    label::Swahili(sw): Saa za kufungua Jumamosi
  - type: text
    name: _sun_hours
    label::English(en): Sunday open hours
    label::French(fr): Heures d'ouverture du dimanche
    label::Spanish(es): Horario del domingo
    label::Swahili(sw): Saa za kufungua Jumapili
  - type: text
    name: _ph_hours
    label::English(en): Public Holiday open hours
    label::French(fr): Heures d'ouverture les jours fériés
    label::Spanish(es): Horario en días festivos
    label::Swahili(sw): Saa za kufungua sikukuu za umma
  - type: calculate
    name: _select_hours
    calculation: concat('Mo ', if(${_mon_hours} != '', ${_mon_hours}, 'off'), '; ',
      'Tu ', if(${_tue_hours} != '', ${_tue_hours}, 'off'), '; ', 'We ', if(${_wed_hours}
      != '', ${_wed_hours}, 'off'), '; ', 'Th ', if(${_thu_hours} != '', ${_thu_hours},
      'off'), '; ', 'Fr ', if(${_fri_hours} != '', ${_fri_hours}, 'off'), '; ', 'Sa
      ', if(${_sat_hours} != '', ${_sat_hours}, 'off'), '; ', 'Su ', if(${_sun_hours}
      != '', ${_sun_hours}, 'off'), '; ', 'PH ', if(${_ph_hours} != '', ${_ph_hours},
      'off'))
  - type: end group
  - type: text
    name: _weekday_hours
    label::English(en): Enter weekday hours
    hint::English(en): Format like:<br>09:00-18:30<br>08:00-11:00,12:30-15:00<br>sunrise-sunset
    relevant: ${_opening_hours_type} = 'oh_weekday'
    required: yes
    label::French(fr): Entrez les horaires de la semaine
    hint::French(fr): Format :<br>09:00-18:30<br>08:00-11:00,12:30-15:00<br>sunrise-sunset
      (lever et coucher du soleil)
    label::Spanish(es): Introduzca el horario de lunes a viernes
    hint::Spanish(es): Formato:<br>09:00-18:30<br>08:00-11:00,12:30-15:00<br>sunrise-sunset
      (salida y puesta del sol)
    label::Swahili(sw): Ingiza saa za siku za kazi
    hint::Swahili(sw): Muundo:<br>09:00-18:30<br>08:00-11:00,12:30-15:00<br>sunrise-sunset
      (macheo hadi machweo)
  - type: text
    name: _advanced_hours
    label::English(en): OSM 'opening_hours'
    hint::English(en): Format like:<br>Mo 10:00-12:00,12:30-15:00; Tu off; We-Fr 08:00-15:00;
      Sa 08:00-12:00; PH off<br><br>sunrise-sunset<br><br>08:00-19:00 open "Office"
      || 00:00-24:00 open "Emergency"<br><br>[More format info](https://wiki.openstreetmap.org/wiki/Key:opening_hours)
    appearance: multiline
    relevant: ${_opening_hours_type} = 'oh_advanced'
    required: yes
    label::French(fr): Champ 'opening_hours' OSM
    hint::French(fr): "Format :<br>Mo 10:00-12:00,12:30-15:00; Tu off; We-Fr 08:00-15:00;\
      \ Sa 08:00-12:00; PH off<br><br>sunrise-sunset<br><br>08:00-19:00 open \"Office\"\
      \ || 00:00-24:00 open \"Emergency\"<br><br>[Plus d'informations sur le format](https://wiki.openstreetmap.org/wiki/Key:opening_hours).\
      \ Rappel : lundi = Mo, mardi = Tu, mercredi = We, jeudi = Th, vendredi = Fr, samedi\
      \ = Sa, dimanche = Su, jours fériés = PH."
    label::Spanish(es): Campo 'opening_hours' de OSM
    hint::Spanish(es): 'Formato:<br>Mo 10:00-12:00,12:30-15:00; Tu off; We-Fr 08:00-15:00;
      Sa 08:00-12:00; PH off<br><br>sunrise-sunset<br><br>08:00-19:00 open "Office"
      || 00:00-24:00 open "Emergency"<br><br>[Más información sobre el formato](https://wiki.openstreetmap.org/wiki/Key:opening_hours).
      Recordatorio: lunes = Mo, martes = Tu, miércoles = We, jueves = Th, viernes =
      Fr, sábado = Sa, domingo = Su, festivos = PH.'
    label::Swahili(sw): Sehemu ya 'opening_hours' ya OSM
    hint::Swahili(sw): 'Muundo:<br>Mo 10:00-12:00,12:30-15:00; Tu off; We-Fr 08:00-15:00;
      Sa 08:00-12:00; PH off<br><br>sunrise-sunset<br><br>08:00-19:00 open "Office"
      || 00:00-24:00 open "Emergency"<br><br>[Maelezo zaidi kuhusu muundo](https://wiki.openstreetmap.org/wiki/Key:opening_hours).
      Kumbuka: Jumatatu = Mo, Jumanne = Tu, Jumatano = We, Alhamisi = Th, Ijumaa = Fr,
      Jumamosi = Sa, Jumapili = Su, sikukuu za umma = PH.'
  - type: calculate
    name: opening_hours
    calculation: if(${_opening_hours_type} = 'oh_select', ${_select_hours}, if(${_opening_hours_type}
      = 'oh_24_7', '24/7', if(${_opening_hours_type} = 'oh_advanced', ${_advanced_hours},
      if(${_opening_hours_type} = 'oh_weekday', concat('Mo-Fr ', ${_weekday_hours},
      '; PH off'), 'unknown'))))
    guidance_hint::English(en): Describes when something is open or closed. There is
      a specific standard format for this data https://wiki.openstreetmap.org/wiki/Key:opening_hours/specification
    guidance_hint::French(fr): 'Décrit quand un lieu est ouvert ou fermé. Ces données
      suivent un format standard : https://wiki.openstreetmap.org/wiki/Key:opening_hours/specification'
    guidance_hint::Spanish(es): 'Describe cuándo un lugar está abierto o cerrado. Estos
      datos siguen un formato estándar: https://wiki.openstreetmap.org/wiki/Key:opening_hours/specification'
    guidance_hint::Swahili(sw): 'Huelezea wakati mahali panapofunguliwa au kufungwa.
      Taarifa hizi hufuata muundo maalum: https://wiki.openstreetmap.org/wiki/Key:opening_hours/specification'
    osm_key: opening_hours
  - type: note
    name: _disp_hours
    label::English(en): 'Verify the open hours are correct or go back and fix: ${opening_hours}'
    label::French(fr): "Vérifiez que les heures d'ouverture sont correctes ou revenez\
      \ en arrière pour les corriger : ${opening_hours}"
    label::Spanish(es): 'Compruebe que el horario es correcto o vuelva atrás para corregirlo:
      ${opening_hours}'
    label::Swahili(sw): 'Hakikisha saa za kufungua ni sahihi au rudi nyuma kuzirekebisha:
      ${opening_hours}'
  - type: select_one amenity_list
    name: amenity
    label::English(en): Facility Category
    guidance_hint::English(en): For describing useful and important facilities for visitors
      and residents
    label::French(fr): Catégorie de la structure sanitaire
    guidance_hint::French(fr): Pour décrire les équipements utiles et importants pour
      les visiteurs et les résidents
    label::Spanish(es): Categoría del establecimiento de salud
    guidance_hint::Spanish(es): Describe instalaciones útiles e importantes para visitantes
      y residentes
    label::Swahili(sw): Aina ya kituo cha afya
    guidance_hint::Swahili(sw): Huelezea huduma muhimu kwa wageni na wakazi
    osm_key: amenity
  - type: select_multiple healthcare_list
    name: healthcare
    label::English(en): Available Services
    required: yes
    guidance_hint::English(en): A key to tag all places that provide healthcare (are
      part of the healthcare sector)
    label::French(fr): Services disponibles
    guidance_hint::French(fr): Clé permettant d'étiqueter tous les lieux qui fournissent
      des soins de santé (qui font partie du secteur de la santé)
    label::Spanish(es): Servicios disponibles
    guidance_hint::Spanish(es): Clave para etiquetar todos los lugares que prestan atención
      de salud (forman parte del sector de la salud)
    label::Swahili(sw): Huduma zinazopatikana
    guidance_hint::Swahili(sw): Ufunguo wa kuweka lebo kwenye maeneo yote yanayotoa
      huduma za afya (yaliyo sehemu ya sekta ya afya)
    osm_key: healthcare
  - type: select_multiple hc_speciality_list
    name: speciality
    label::English(en): Specialities
    guidance_hint::English(en): A key to detail the special services provided by a healthcare
      facility. To be used in conjunction with the 'healthcare=*' tag. For example 'healthcare=laboratory',
      and 'healthcare:speciality=blood_check'
    label::French(fr): Spécialités
    guidance_hint::French(fr): Clé détaillant les services spécialisés fournis par une
      structure sanitaire. À utiliser avec la clé « healthcare=* ». Par exemple « healthcare=laboratory
      » et « healthcare:speciality=blood_check »
    label::Spanish(es): Especialidades
    guidance_hint::Spanish(es): Clave que detalla los servicios especializados de un
      establecimiento de salud. Se usa junto con la etiqueta 'healthcare=*'. Por ejemplo
      'healthcare=laboratory' y 'healthcare:speciality=blood_check'
    label::Swahili(sw): Utaalamu
    guidance_hint::Swahili(sw): Ufunguo unaoeleza huduma maalum zinazotolewa na kituo
      cha afya. Hutumika pamoja na lebo ya 'healthcare=*'. Kwa mfano 'healthcare=laboratory'
      na 'healthcare:speciality=blood_check'
    osm_key: healthcare:speciality
  - type: select_multiple amenity_type_list
    name: health_amenity_type
    label::English(en): Speciality medical equipment available
    guidance_hint::English(en): Indicates what type of speciality medical equipment
      is available at the healthsite
    label::French(fr): Équipement médical spécialisé disponible
